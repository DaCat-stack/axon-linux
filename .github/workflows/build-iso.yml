name: Сборка ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Собрать ISO в контейнере Arch
        run: docker run --rm --privileged -v "$PWD:/build" archlinux:latest bash /build/build.sh

      - name: Выложить ISO
        uses: actions/upload-artifact@v4
        with:
          name: axon-linux-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 7
