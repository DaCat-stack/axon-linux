name: Сборка ISO

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  greeter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Окно входа — проверка QML и скриншоты
        run: docker run --rm -v "$PWD:/build" archlinux:latest bash /build/ci/greeter-shot.sh /build/greeter
      - name: Выложить скриншоты окна входа
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greeter
          path: greeter/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # версия пакетов AXON считается по истории git

      - name: Статические проверки
        run: tests/static.sh

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Собрать ISO в контейнере Arch
        run: docker run --rm --privileged -v "$PWD:/build" archlinux:latest bash /build/build.sh

      - name: Загрузить ISO в QEMU и снять экран
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 imagemagick
          sudo chmod 666 /dev/kvm || true
          ci/smoke-qemu.sh out/*.iso screens

      - name: Выложить скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/
          if-no-files-found: ignore

      - name: Выложить ISO
        uses: actions/upload-artifact@v4
        with:
          name: axon-linux-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 7
