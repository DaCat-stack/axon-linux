name: Пакеты AXON

on:
  push:
    paths:
      - 'packages/**'
      - 'pkgsrc/**'
      - 'ci/build-packages.sh'
      - 'ci/repo-add-channel.sh'
      - 'ci/publish-*.sh'
      - 'ci/e2e-repo.sh'
      - '.github/workflows/packages.yml'
  schedule:
    - cron: '0 3 * * *'   # каждую ночь: пересборка + «пульс», чтобы сайт не выглядел заброшенным
  workflow_dispatch:

concurrency:
  group: axon-repo
  cancel-in-progress: false

env:
  BASE: https://dacat-stack.github.io/axon-repo
  PKGS: axon-keyring axon-branding axon-welcome

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Доступ к axon-repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AXON_REPO_DEPLOY_KEY }}" > ~/.ssh/axon_repo && chmod 600 ~/.ssh/axon_repo
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch gh-pages -c core.sshCommand="ssh -i ~/.ssh/axon_repo" \
            git@github.com:DaCat-stack/axon-repo.git site

      - name: Собрать, подписать, положить в axon-testing
        env:
          AXON_SIGN_SUBKEY: ${{ secrets.AXON_SIGN_SUBKEY }}
          AXON_SIGN_PASS: ${{ secrets.AXON_SIGN_PASS }}
        run: docker run --rm -e AXON_SIGN_SUBKEY -e AXON_SIGN_PASS -v "$PWD:/build" archlinux:latest bash /build/ci/publish-build.sh /build/site

      - name: Опубликовать
        run: ci/publish-deploy.sh site "testing $(git rev-parse --short HEAD)"

      - name: Проверка axon-testing как у пользователя
        run: ci/e2e-repo.sh "$BASE" axon-testing $PKGS || true

      - name: Перенести прошедшие в axon
        env:
          AXON_SIGN_SUBKEY: ${{ secrets.AXON_SIGN_SUBKEY }}
          AXON_SIGN_PASS: ${{ secrets.AXON_SIGN_PASS }}
        run: |
          cat e2e-passed.txt
          docker run --rm -e AXON_SIGN_SUBKEY -e AXON_SIGN_PASS -v "$PWD:/build" archlinux:latest \
            bash /build/ci/publish-promote.sh /build/site /build/e2e-passed.txt
          ci/publish-deploy.sh site "stable $(git rev-parse --short HEAD)"

      - name: Проверка axon как у пользователя
        run: ci/e2e-repo.sh "$BASE" axon $PKGS

      - name: Не все пакеты прошли проверку в axon-testing
        run: |
          for p in $PKGS; do grep -qx "$p" e2e-passed.txt || { echo "::error::$p не перенесён в axon"; exit 1; }; done
