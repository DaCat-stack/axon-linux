name: Пакеты AXON

# Здесь пакеты только собираются (проверка, без секретов). Публикует их репозиторий
# DaCat-stack/axon-repo своим workflow (исходник: repo-site/publish.yml) — он каждые 15 минут
# забирает новый main и выкладывает подписанные пакеты.
on:
  push:
    paths:
      - 'packages/**'
      - 'pkgsrc/**'
      - 'ci/build-packages.sh'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать пакеты AXON
        run: docker run --rm -v "$PWD:/build" archlinux:latest bash -c "/build/ci/use-mirrors.sh && pacman -Syu --noconfirm && /build/ci/build-packages.sh /build/out-pkgs"
