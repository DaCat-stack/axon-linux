---
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    GRUB_THEME: "/usr/share/grub/themes/axon/theme.txt"
    GRUB_DISABLE_RECOVERY: true
    # меню выбора системы: Windows появится рядом с AXON
    GRUB_DISABLE_OS_PROBER: false
kernel_params: [ "quiet", "splash", "nvidia_drm.modeset=1" ]
