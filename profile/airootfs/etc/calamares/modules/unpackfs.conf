---
unpack:
    # чистый образ live-системы (без изменений сессии)
    - source: "/run/archiso/airootfs"
      sourcefs: "file"
      destination: ""
    # archiso убирает ядро из образа — берём с носителя (микрокод даёт хук microcode)
    - source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux"
      sourcefs: "file"
      destination: "/boot/vmlinuz-linux"
