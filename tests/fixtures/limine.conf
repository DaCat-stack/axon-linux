timeout: 5
default_entry: 2
interface_branding: CachyOS Linux
interface_branding_color: 2
hash_mismatch_panic: no
wallpaper: boot():/limine-splash.png

/+CachyOS
    comment: machine-id=0123456789abcdef0123456789abcdef order-priority=50
    //linux-cachyos
        comment: kernel-id=linux-cachyos
        protocol: linux
        path: boot():/0123/linux-cachyos/vmlinuz-linux-cachyos
        cmdline: quiet nowatchdog splash rw rootflags=subvol=/@ root=UUID=x
        module_path: boot():/0123/linux-cachyos/initramfs-linux-cachyos
    //Snapshots
